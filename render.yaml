services:
  - type: web
    name: ai-knowledge-assistant-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: knowledge-base-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: AI_MODE
        value: CLOUD
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_BASE_URL
        value: https://api.openai.com/v1
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: ai-knowledge-assistant-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: ai-knowledge-assistant-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-knowledge-assistant-api
          envVarKey: RENDER_EXTERNAL_URL
