services:
  - type: web
    name: ai-knowledge-assistant-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATA_DIR
        value: /tmp/ai-knowledge-assistant
      - key: AI_MODE
        value: CLOUD
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUD_API_KEY
        sync: false
      - key: CHROMA_OPENAI_API_KEY
        fromService:
          type: web
          name: ai-knowledge-assistant-api
          envVarKey: CLOUD_API_KEY
      - key: CLOUD_BASE_URL
        value: https://api.openai.com/v1
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: ai-knowledge-assistant-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: ai-knowledge-assistant-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-knowledge-assistant-api
          envVarKey: RENDER_EXTERNAL_URL
